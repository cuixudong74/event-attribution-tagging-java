server.port=0

# 归因模型：FIRST_TOUCH（首次触点）/ LAST_TOUCH（末次触点）/ TIME_WEIGHTED（时间加权）
attribution.model=LAST_TOUCH
# 归因窗口长度，支持 7d、24h 风格或 ISO-8601（如 P7D）
attribution.window=7d
# 时间加权模型的半衰期（指数衰减），仅 TIME_WEIGHTED 生效
attribution.half-life=24h
# 参与归因的触点类型（转化 CONVERSION 是归因目标，不可作为触点）
attribution.touch-types=IMPRESSION,CLICK
